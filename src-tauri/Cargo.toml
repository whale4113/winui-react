[package]
name = "winui-react-gallery"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_ViewManagement", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

